<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" role="img" aria-labelledby="pacs-schem-title pacs-schem-desc" class="schem">
  <title id="pacs-schem-title">Picture Archiving and Communication System — schematic</title>
  <desc id="pacs-schem-desc">DICOM modalities, a DICOM workstation, a CD/DVD burner, a DICOM printer and a vendor neutral archive exchange data both ways with the central PACS / RIS server. The server also exchanges data with a firewall, which connects through the internet to an offsite archive and a remote DICOM workstation, and with a DICOM router that forwards studies one way to a remote location hospital.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .lbl { fill: var(--ink-2); font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1.5 5.5; animation: schem-march 1.4s linear infinite; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .pkt.back { animation-direction: reverse; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: schem-flicker 1.6s ease-in-out infinite; }
    .schem .wifi { animation: schem-blink 2.6s ease-in-out infinite; }
    .schem .cloud { transform-box: fill-box; transform-origin: 50% 50%; animation: schem-bob 5s ease-in-out infinite; }
    @keyframes schem-march { to { stroke-dashoffset: -14; } }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes schem-flicker { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, 0.94); } }
    @keyframes schem-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .schem .link, .schem .led, .schem .flame, .schem .wifi, .schem .cloud { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="schem-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Links (dotted, arrowheads mark direction; packets travel the way data flows) ══ -->
  <g id="schem-links">
    <!-- 1 DICOM Workstation ⇄ Server -->
    <path class="link" d="M243 110 L310 170" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 2 DICOM Modalities ⇄ Server -->
    <path class="link" d="M197 240 L318 193" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 3 Server ⇄ CD/DVD burner -->
    <path class="link" d="M418 125 L448 88" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 4 Server ⇄ DICOM Printer -->
    <path class="link" d="M447 133 L518 82" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 5 Server ⇄ Firewall -->
    <path class="link" d="M455 178 L505 178" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 6 Firewall ⇄ Internet -->
    <path class="link" d="M565 178 L617 178" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 7 Internet ⇄ Offsite Archive -->
    <path class="link" d="M668 154 L693 100" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 8 Internet ⇄ DICOM Workstation (remote) -->
    <path class="link" d="M662 205 L676 246" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 9 Server ⇄ Vendor Neutral Archive -->
    <path class="link" d="M370 236 L340 274" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 10 Server ⇄ DICOM Router -->
    <path class="link" d="M457 208 L498 246" marker-start="url(#schem-arrow)" marker-end="url(#schem-arrow)"/>
    <!-- 11 DICOM Router → Remote location Hospital (one way) -->
    <path class="link" d="M534 284 L550 303" marker-end="url(#schem-arrow)"/>
  </g>

  <!-- ══ Packets: one each way on two-way links, one on the one-way link ══ -->
  <g id="schem-packets" aria-hidden="true">
    <circle class="pkt" r="3.2" style="offset-path: path('M243 110 L310 170'); animation-delay: 0s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M243 110 L310 170'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M197 240 L318 193'); animation-delay: -0.6s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M197 240 L318 193'); animation-delay: -2.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M418 125 L448 88'); animation-delay: -1.2s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M418 125 L448 88'); animation-delay: -3s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M447 133 L518 82'); animation-delay: -0.3s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M447 133 L518 82'); animation-delay: -2.1s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M455 178 L505 178'); animation-delay: -0.9s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M455 178 L505 178'); animation-delay: -2.7s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M565 178 L617 178'); animation-delay: -1.5s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M565 178 L617 178'); animation-delay: -3.3s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M668 154 L693 100'); animation-delay: -0.4s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M668 154 L693 100'); animation-delay: -2.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M662 205 L676 246'); animation-delay: -1.1s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M662 205 L676 246'); animation-delay: -2.9s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M370 236 L340 274'); animation-delay: -0.7s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M370 236 L340 274'); animation-delay: -2.5s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M457 208 L498 246'); animation-delay: -1.4s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M457 208 L498 246'); animation-delay: -3.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M534 284 L550 303'); animation-delay: -2s"/>
  </g>

  <!-- ══ Nodes ══ -->
  <!-- DICOM Workstation (local) -->
  <g id="n-ws-local" transform="translate(150 40)">
    <rect class="ic ic-fill" x="0" y="0" width="72" height="48" rx="4"/>
    <path class="ic" d="M36 48v10M22 60h28"/>
    <rect class="ic ic-fill" x="79" y="14" width="22" height="34" rx="3"/>
    <circle class="ic" cx="90" cy="43" r="1.2"/>
    <text class="lbl" x="50" y="86" text-anchor="middle">DICOM Workstation</text>
  </g>

  <!-- DICOM Modalities: scanner bed, MR/CT gantry, ultrasound, C-arm -->
  <g id="n-modalities" transform="translate(65 185)">
    <!-- radiotherapy / scanner arm over bed -->
    <g class="ic">
      <path d="M6 30 A24 24 0 0 1 54 30"/>
      <path class="ic-soft" d="M20 14v8M30 12v10M40 14v8"/>
      <circle cx="30" cy="34" r="5"/>
      <path d="M8 46h44l-4 8H12z"/>
    </g>
    <!-- MR / CT gantry -->
    <g class="ic" transform="translate(70 0)">
      <path class="ic-fill" d="M2 52V26A26 26 0 0 1 54 26v26"/>
      <circle cx="28" cy="26" r="12"/>
      <path d="M28 38v10M18 56h20"/>
    </g>
    <!-- ultrasound: sonographer, patient on bed, monitor -->
    <g class="ic" transform="translate(0 66)">
      <rect class="ic-fill" x="12" y="2" width="20" height="14" rx="2"/>
      <path class="ic-soft" d="M17 9h3M23 6h4"/>
      <circle cx="10" cy="20" r="4"/>
      <path d="M6 44V30a4 4 0 0 1 8 0v8h12"/>
      <circle cx="44" cy="30" r="4"/>
      <path d="M4 44h50v6H4zM50 44V38a4 4 0 0 0-8 0v6M8 50v4M50 50v4"/>
    </g>
    <!-- C-arm -->
    <g class="ic" transform="translate(70 66)">
      <path d="M44 6a22 22 0 0 0 0 44"/>
      <rect x="40" y="0" width="12" height="10" rx="2"/>
      <rect x="40" y="44" width="12" height="10" rx="2"/>
      <rect class="ic-fill" x="4" y="28" width="26" height="20" rx="3"/>
      <path d="M6 54h22M10 48v6M24 48v6"/>
    </g>
    <text class="lbl" x="63" y="143" text-anchor="middle">DICOM Modalities</text>
  </g>

  <!-- CD/DVD burner -->
  <g id="n-burner" transform="translate(396 22)">
    <circle class="ic ic-fill" cx="30" cy="20" r="18"/>
    <circle class="ic" cx="30" cy="20" r="5"/>
    <rect class="ic ic-fill" x="4" y="42" width="52" height="14" rx="3"/>
    <path class="ic-soft" d="M12 49h10"/>
    <text class="lbl" x="-5" y="68" text-anchor="middle">CD/DVD burner</text>
  </g>

  <!-- DICOM Printer (film with a hand radiograph) -->
  <g id="n-printer" transform="translate(518 26)">
    <path class="ic" d="M0 6h58M8 6v-4h42v4"/>
    <rect class="ic ic-fill" x="6" y="12" width="46" height="34" rx="2"/>
    <rect class="ic" x="12" y="18" width="34" height="22" rx="1"/>
    <path class="ic ic-soft" d="M24 36l-4-9M28 36l-1-12M32 36l3-11M36 36l5-8M40 34l4-4"/>
    <text class="lbl" x="48" y="64" text-anchor="middle">DICOM Printer</text>
  </g>

  <!-- PACS / RIS Server (three towers) -->
  <g id="n-server" transform="translate(325 130)">
    <rect class="ic ic-fill" x="0" y="8" width="34" height="88" rx="3"/>
    <path class="ic-soft ic" d="M7 20h20M7 28h20M7 36h20M7 44h20"/>
    <rect class="ic ic-fill" x="41" y="0" width="34" height="96" rx="3"/>
    <path class="ic-soft ic" d="M48 12h20M48 20h20M48 28h20M48 36h20"/>
    <circle class="ic" cx="58" cy="76" r="5"/>
    <rect class="ic ic-fill" x="82" y="8" width="34" height="88" rx="3"/>
    <path class="ic-soft ic" d="M89 20h20M89 28h20M89 36h20M89 44h20"/>
    <circle class="led" cx="8" cy="84" r="1.8"/>
    <circle class="led" cx="90" cy="84" r="1.8" style="animation-delay: -1.1s"/>
    <text class="lbl" x="98" y="112" text-anchor="middle">PACS / RIS Server</text>
  </g>

  <!-- Vendor Neutral Archive (two cylinders) -->
  <g id="n-vna" transform="translate(292 278)">
    <g class="ic">
      <path class="ic-fill" d="M4 12v40c0 4 9 7 20 7s20-3 20-7V12"/>
      <ellipse class="ic-fill" cx="24" cy="12" rx="20" ry="7"/>
      <path class="ic-soft" d="M4 26c0 4 9 7 20 7s20-3 20-7M4 40c0 4 9 7 20 7s20-3 20-7"/>
    </g>
    <g class="ic" transform="translate(28 8)">
      <path class="ic-fill" d="M4 12v42c0 4 10 8 24 8s24-4 24-8V12"/>
      <ellipse class="ic-fill" cx="28" cy="12" rx="24" ry="8"/>
      <path class="ic-soft" d="M4 26c0 4 10 8 24 8s24-4 24-8M4 40c0 4 10 8 24 8s24-4 24-8"/>
    </g>
    <text class="lbl" x="42" y="86" text-anchor="middle">Vendor Neutral Archive</text>
  </g>

  <!-- Firewall (flame) -->
  <g id="n-firewall" transform="translate(516 140)">
    <path class="ic ic-fill flame" d="M20 2c2 10 12 14 12 28a12 12 0 0 1-24 0c0-6 4-9 5-14 3 3 4 6 4 9 2-5 1-13 3-23z"/>
    <path class="ic ic-soft" d="M20 42a6 6 0 0 1-6-6c0-3 2-4 3-7 2 2 3 4 3 6 1-2 0-6 0-8"/>
    <text class="lbl" x="20" y="72" text-anchor="middle">Firewall</text>
  </g>

  <!-- DICOM Router -->
  <g id="n-router" transform="translate(500 240)">
    <g class="ic wifi">
      <path d="M8 20a16 16 0 0 1 24 0"/>
      <path d="M13 26a9 9 0 0 1 14 0"/>
      <circle cx="20" cy="31" r="1.4"/>
    </g>
    <rect class="ic ic-fill" x="2" y="36" width="36" height="12" rx="3"/>
    <path class="ic-soft ic" d="M8 42h4M15 42h4"/>
    <text class="lbl" x="44" y="34">DICOM Router</text>
  </g>

  <!-- Remote location Hospital (house) -->
  <g id="n-hospital" transform="translate(548 300)">
    <path class="ic ic-fill" d="M2 22L22 4l20 18M6 20v24h32V20"/>
    <path class="ic" d="M34 6v8"/>
    <rect class="ic" x="18" y="30" width="8" height="14"/>
    <path class="ic ic-soft" d="M22 24h.1"/>
    <text class="lbl" x="22" y="60" text-anchor="middle">Remote location Hospital</text>
  </g>

  <!-- Internet (cloud) -->
  <g id="n-internet" transform="translate(626 160)">
    <path class="ic ic-fill cloud" d="M14 34h30a10 10 0 0 0 1-20a13 13 0 0 0-25-3a9 9 0 0 0-6 23z"/>
    <text class="lbl" x="60" y="27">Internet</text>
  </g>

  <!-- Offsite Archive (stacked cylinders) -->
  <g id="n-offsite" transform="translate(684 40)">
    <g class="ic">
      <path class="ic-fill" d="M4 12v40c0 4 9 7 20 7s20-3 20-7V12"/>
      <ellipse class="ic-fill" cx="24" cy="12" rx="20" ry="7"/>
      <path class="ic-soft" d="M4 26c0 4 9 7 20 7s20-3 20-7M4 40c0 4 9 7 20 7s20-3 20-7"/>
    </g>
    <g class="ic" transform="translate(26 6)">
      <path class="ic-fill" d="M4 12v44c0 4 10 8 24 8s24-4 24-8V12"/>
      <ellipse class="ic-fill" cx="28" cy="12" rx="24" ry="8"/>
      <path class="ic-soft" d="M4 26c0 4 10 8 24 8s24-4 24-8M4 40c0 4 10 8 24 8s24-4 24-8"/>
    </g>
    <text class="lbl" x="46" y="86" text-anchor="middle">Offsite Archive</text>
  </g>

  <!-- DICOM Workstation (remote) -->
  <g id="n-ws-remote" transform="translate(678 246)">
    <rect class="ic ic-fill" x="0" y="0" width="72" height="48" rx="4"/>
    <path class="ic" d="M36 48v10M22 60h28"/>
    <rect class="ic ic-fill" x="79" y="14" width="22" height="34" rx="3"/>
    <circle class="ic" cx="90" cy="43" r="1.2"/>
    <text class="lbl" x="50" y="78" text-anchor="middle">DICOM Workstation</text>
  </g>
</svg>
