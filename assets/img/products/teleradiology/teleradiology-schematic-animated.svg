<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="tele-schem-title tele-schem-desc" class="schem">
  <title id="tele-schem-title">Teleradiology — multi-site reporting on a central iPACS</title>
  <desc id="tele-schem-desc">Hospitals A, B and C each exchange studies with a DICOM router, and the routers exchange with the internet. Step 1: image acquisition at the centre. Step 2: studies are uploaded through the internet to the central PACS / RIS server, which exchanges with a vendor neutral archive and, through a firewall and the internet, with a remote DICOM workstation. Step 3: the radiologist reports the study at the DICOM workstation. Step 4: reports are uploaded to the PACS server. Step 5: doctors at the hospital view image and report. Every link is two-way.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --on-g: var(--on-green, #03110c); font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .cross { fill: var(--gb); stroke: none; }
    .schem .lbl { fill: var(--ink-2); font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .lbl tspan.b { font-weight: 700; fill: var(--ink); }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1.5 5.5; animation: schem-march 1.4s linear infinite; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .pkt.back { animation-direction: reverse; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: schem-flicker 1.6s ease-in-out infinite; }
    .schem .cloud { transform-box: fill-box; transform-origin: 50% 50%; animation: schem-bob 5s ease-in-out infinite; }
    .schem .step { fill: var(--g); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
    .schem .step-n { fill: var(--on-g); font-size: 14px; font-weight: 700; }
    .schem .step-ring { fill: none; stroke: var(--gb); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: schem-ping 3.2s ease-out infinite; }
    .schem .note { fill: rgba(0, 168, 123, 0.14); stroke: rgba(0, 168, 123, 0.45); stroke-width: 1; stroke-linejoin: round; }
    .schem .note-t { fill: var(--ink); font-size: 12px; font-weight: 600; }
    @keyframes schem-march { to { stroke-dashoffset: -14; } }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes schem-flicker { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.06, 0.94); } }
    @keyframes schem-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes schem-ping { 0% { transform: scale(1); opacity: 0.8; } 70%, 100% { transform: scale(2.1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .schem .link, .schem .led, .schem .flame, .schem .cloud, .schem .step-ring { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="tele-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Links — all eleven exchange both ways ══ -->
  <g id="tele-links">
    <!-- Hospital A ⇄ Router A -->
    <path class="link" d="M135 100 L158 100" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Router A ⇄ Internet (curved) -->
    <path class="link" d="M200 103 C236 124 232 182 252 210" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Hospital B ⇄ Router B -->
    <path class="link" d="M135 232 L158 232" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Router B ⇄ Internet -->
    <path class="link" d="M203 232 L247 232" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Internet ⇄ PACS / RIS Server -->
    <path class="link" d="M308 232 L354 232" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Hospital C ⇄ Router C -->
    <path class="link" d="M135 355 L158 355" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Router C ⇄ Internet (curved) -->
    <path class="link" d="M200 349 C236 332 232 278 251 254" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- PACS / RIS Server ⇄ Firewall (curved) -->
    <path class="link" d="M452 230 C488 232 476 165 512 163" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Firewall ⇄ Internet (remote) -->
    <path class="link" d="M553 163 L628 163" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- Internet (remote) ⇄ DICOM Workstation (curved) -->
    <path class="link" d="M701 166 C732 190 716 290 682 333" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
    <!-- PACS / RIS Server ⇄ Vendor Neutral Archive -->
    <path class="link" d="M402 290 L402 343" marker-start="url(#tele-arrow)" marker-end="url(#tele-arrow)"/>
  </g>

  <!-- ══ Packets: one each way per link ══ -->
  <g id="tele-packets" aria-hidden="true">
    <circle class="pkt" r="3.2" style="offset-path: path('M135 100 L158 100'); animation-delay: 0s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M135 100 L158 100'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M200 103 C236 124 232 182 252 210'); animation-delay: -0.4s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M200 103 C236 124 232 182 252 210'); animation-delay: -2.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M135 232 L158 232'); animation-delay: -0.8s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M135 232 L158 232'); animation-delay: -2.6s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M203 232 L247 232'); animation-delay: -1.2s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M203 232 L247 232'); animation-delay: -3s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M308 232 L354 232'); animation-delay: -0.6s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M308 232 L354 232'); animation-delay: -2.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M135 355 L158 355'); animation-delay: -1.6s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M135 355 L158 355'); animation-delay: -3.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M200 349 C236 332 232 278 251 254'); animation-delay: -1s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M200 349 C236 332 232 278 251 254'); animation-delay: -2.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M452 230 C488 232 476 165 512 163'); animation-delay: -0.2s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M452 230 C488 232 476 165 512 163'); animation-delay: -2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M553 163 L628 163'); animation-delay: -1.4s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M553 163 L628 163'); animation-delay: -3.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M701 166 C732 190 716 290 682 333'); animation-delay: -0.9s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M701 166 C732 190 716 290 682 333'); animation-delay: -2.7s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M402 290 L402 343'); animation-delay: -1.7s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M402 290 L402 343'); animation-delay: -3.5s"/>
  </g>

  <!-- ══ Hospitals and their routers ══ -->
  <g id="n-hospital-a" transform="translate(80 66)">
    <g class="ic">
      <path d="M4 12h48M8 4h40v8H8z"/>
      <rect class="ic-fill" x="6" y="12" width="44" height="46" rx="2"/>
      <path class="ic-soft" d="M12 16v42M44 16v42"/>
      <circle cx="28" cy="30" r="10"/>
      <path class="cross" d="M26 24h4v4h4v4h-4v4h-4v-4h-4v-4h4z"/>
      <path d="M22 58V48a6 6 0 0 1 12 0v10M28 48v10"/>
    </g>
    <text class="lbl" x="28" y="78" text-anchor="middle">Hospital <tspan class="b">A</tspan></text>
  </g>
  <g id="n-router-a" transform="translate(161 90)">
    <g class="ic">
      <path class="ic-fill" d="M16 2l14 8-14 8L2 10z"/>
      <path class="ic-soft" d="M2 10v3l14 8 14-8v-3"/>
    </g>
    <text class="lbl" x="16" y="38" text-anchor="middle">DICOM</text>
    <text class="lbl" x="16" y="53" text-anchor="middle">Router</text>
  </g>
  <g id="n-hospital-b" transform="translate(80 192)">
    <g class="ic">
      <path d="M4 12h48M8 4h40v8H8z"/>
      <rect class="ic-fill" x="6" y="12" width="44" height="46" rx="2"/>
      <path class="ic-soft" d="M12 16v42M44 16v42"/>
      <circle cx="28" cy="30" r="10"/>
      <path class="cross" d="M26 24h4v4h4v4h-4v4h-4v-4h-4v-4h4z"/>
      <path d="M22 58V48a6 6 0 0 1 12 0v10M28 48v10"/>
    </g>
    <text class="lbl" x="28" y="78" text-anchor="middle">Hospital <tspan class="b">B</tspan></text>
  </g>
  <g id="n-router-b" transform="translate(161 222)">
    <g class="ic">
      <path class="ic-fill" d="M16 2l14 8-14 8L2 10z"/>
      <path class="ic-soft" d="M2 10v3l14 8 14-8v-3"/>
    </g>
    <text class="lbl" x="16" y="38" text-anchor="middle">DICOM</text>
    <text class="lbl" x="16" y="53" text-anchor="middle">Router</text>
  </g>
  <g id="n-hospital-c" transform="translate(80 315)">
    <g class="ic">
      <path d="M4 12h48M8 4h40v8H8z"/>
      <rect class="ic-fill" x="6" y="12" width="44" height="46" rx="2"/>
      <path class="ic-soft" d="M12 16v42M44 16v42"/>
      <circle cx="28" cy="30" r="10"/>
      <path class="cross" d="M26 24h4v4h4v4h-4v4h-4v-4h-4v-4h4z"/>
      <path d="M22 58V48a6 6 0 0 1 12 0v10M28 48v10"/>
    </g>
    <text class="lbl" x="28" y="78" text-anchor="middle">Hospital <tspan class="b">C</tspan></text>
  </g>
  <g id="n-router-c" transform="translate(161 345)">
    <g class="ic">
      <path class="ic-fill" d="M16 2l14 8-14 8L2 10z"/>
      <path class="ic-soft" d="M2 10v3l14 8 14-8v-3"/>
    </g>
    <text class="lbl" x="16" y="38" text-anchor="middle">DICOM</text>
    <text class="lbl" x="16" y="53" text-anchor="middle">Router</text>
  </g>

  <!-- ══ Internet (hospital side) ══ -->
  <g id="n-internet-a" transform="translate(248 208)">
    <path class="ic ic-fill cloud" d="M14 34h30a10 10 0 0 0 1-20a13 13 0 0 0-25-3a9 9 0 0 0-6 23z"/>
    <text class="lbl" x="28" y="51" text-anchor="middle">Internet</text>
  </g>

  <!-- ══ PACS / RIS Server ══ -->
  <g id="n-server" transform="translate(360 195)">
    <rect class="ic ic-fill" x="0" y="6" width="26" height="60" rx="3"/>
    <path class="ic ic-soft" d="M6 15h14M6 22h14M6 29h14M6 36h14"/>
    <rect class="ic ic-fill" x="31" y="0" width="26" height="66" rx="3"/>
    <path class="ic ic-soft" d="M37 9h14M37 16h14M37 23h14M37 30h14"/>
    <circle class="ic" cx="44" cy="52" r="4"/>
    <rect class="ic ic-fill" x="62" y="6" width="26" height="60" rx="3"/>
    <path class="ic ic-soft" d="M68 15h14M68 22h14M68 29h14M68 36h14"/>
    <circle class="led" cx="6" cy="58" r="1.6"/>
    <circle class="led" cx="68" cy="58" r="1.6" style="animation-delay: -1.1s"/>
    <text class="lbl" x="44" y="84" text-anchor="middle">PACS / RIS Server</text>
  </g>

  <!-- ══ Vendor Neutral Archive ══ -->
  <g id="n-vna" transform="translate(372 350)">
    <g class="ic">
      <path class="ic-fill" d="M4 10v30c0 4 8 6 16 6s16-2 16-6V10"/>
      <ellipse class="ic-fill" cx="20" cy="10" rx="16" ry="6"/>
      <path class="ic-soft" d="M4 22c0 4 8 6 16 6s16-2 16-6M4 34c0 4 8 6 16 6s16-2 16-6"/>
    </g>
    <g class="ic" transform="translate(22 6)">
      <path class="ic-fill" d="M4 10v32c0 4 9 7 19 7s19-3 19-7V10"/>
      <ellipse class="ic-fill" cx="23" cy="10" rx="19" ry="7"/>
      <path class="ic-soft" d="M4 22c0 4 9 7 19 7s19-3 19-7M4 34c0 4 9 7 19 7s19-3 19-7"/>
    </g>
    <text class="lbl" x="31" y="72" text-anchor="middle">Vendor Neutral Archive</text>
  </g>

  <!-- ══ Firewall ══ -->
  <g id="n-firewall" transform="translate(511 140)">
    <path class="ic ic-fill flame" d="M17 2c2 9 10 12 10 24a10 10 0 0 1-20 0c0-5 3-8 4-12 3 3 3 5 3 8 2-4 1-11 3-20z"/>
    <text class="lbl" x="17" y="56" text-anchor="middle">Firewall</text>
  </g>

  <!-- ══ Internet (remote side) ══ -->
  <g id="n-internet-b" transform="translate(636 143)">
    <path class="ic ic-fill cloud" d="M14 34h30a10 10 0 0 0 1-20a13 13 0 0 0-25-3a9 9 0 0 0-6 23z"/>
    <text class="lbl" x="28" y="51" text-anchor="middle">Internet</text>
  </g>

  <!-- ══ DICOM Workstation (radiologist) ══ -->
  <g id="n-workstation" transform="translate(615 338)">
    <rect class="ic ic-fill" x="0" y="0" width="80" height="54" rx="4"/>
    <path class="ic" d="M40 54v10M25 66h30"/>
    <rect class="ic ic-fill" x="87" y="18" width="24" height="36" rx="3"/>
    <circle class="ic" cx="99" cy="49" r="1.2"/>
    <text class="lbl" x="48" y="84" text-anchor="middle">DICOM Workstation</text>
  </g>

  <!-- ══ Step badges ══ -->
  <g id="steps">
    <g transform="translate(211 72)">
      <circle class="step-ring" r="15"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">1</text>
    </g>
    <g transform="translate(402 163)">
      <circle class="step-ring" r="15" style="animation-delay: -0.6s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">2</text>
    </g>
    <g transform="translate(648 310)">
      <circle class="step-ring" r="15" style="animation-delay: -1.2s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">3</text>
    </g>
    <g transform="translate(428 305)">
      <circle class="step-ring" r="15" style="animation-delay: -1.8s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">4</text>
    </g>
    <g transform="translate(214 414)">
      <circle class="step-ring" r="15" style="animation-delay: -2.4s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- ══ Callouts ══ -->
  <!-- 1  Image acquisition at centre (tail left, to step 1) -->
  <g id="c-acquire" transform="translate(240 56)">
    <path class="note" d="M12 0h80a6 6 0 0 1 6 6v46a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V28l-6-4 6-4V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="52" y="19" text-anchor="middle">Image</text>
    <text class="note-t" x="52" y="35" text-anchor="middle">acquisition at</text>
    <text class="note-t" x="52" y="51" text-anchor="middle">centre</text>
  </g>
  <!-- 2  Uploaded to central PACS Server (tail bottom-left, to step 2) -->
  <g id="c-upload" transform="translate(432 84)">
    <path class="note" d="M6 0h104a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H16l-14 10 4-10a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="58" y="17" text-anchor="middle">Uploaded to central</text>
    <text class="note-t" x="58" y="33" text-anchor="middle">PACS Server</text>
  </g>
  <!-- 3  Radiologist reports study (tail bottom, to step 3) -->
  <g id="c-report" transform="translate(588 234)">
    <path class="note" d="M6 0h72a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H62l-2 10-6-10H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="42" y="17" text-anchor="middle">Radiologist</text>
    <text class="note-t" x="42" y="33" text-anchor="middle">reports study</text>
  </g>
  <!-- 4  Reports uploaded to PACS Server (tail top-left, to step 4) -->
  <g id="c-reports" transform="translate(442 352)">
    <path class="note" d="M6 0h100a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6L-6-14 6 0z"/>
    <text class="note-t" x="56" y="17" text-anchor="middle">Reports uploaded to</text>
    <text class="note-t" x="56" y="33" text-anchor="middle">PACS Server</text>
  </g>
  <!-- 5  Doctors at hospital view image and report (tail bottom-left, to step 5) -->
  <g id="c-view" transform="translate(240 312)">
    <path class="note" d="M6 0h74a6 6 0 0 1 6 6v62a6 6 0 0 1-6 6H16l-18 8 8-8a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="43" y="19" text-anchor="middle">Doctors at</text>
    <text class="note-t" x="43" y="35" text-anchor="middle">hospital view</text>
    <text class="note-t" x="43" y="51" text-anchor="middle">image and</text>
    <text class="note-t" x="43" y="67" text-anchor="middle">report</text>
  </g>
</svg>
