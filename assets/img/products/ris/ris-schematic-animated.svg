<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 563" role="img" aria-labelledby="ris-schem-title ris-schem-desc" class="schem">
  <title id="ris-schem-title">Radiology Information System — order-to-report workflow</title>
  <desc id="ris-schem-desc">Step 1: the Hospital Information System raises a HIS order and exchanges it with the Radiology Information System. Step 2: the RIS exchanges the worklist with the DICOM modalities (step 3) and with PACS, and exchanges the study with the reporting workstation. Step 4: the radiologist reports the study at the reporting workstation and the report is uploaded in the RIS. Every link is two-way.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --on-g: var(--on-green, #03110c); font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .lbl { fill: var(--ink-2); font-size: 13px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1.5 5.5; animation: schem-march 1.4s linear infinite; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .pkt.back { animation-direction: reverse; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .step { fill: var(--g); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
    .schem .step-n { fill: var(--on-g); font-size: 14px; font-weight: 700; }
    .schem .step-ring { fill: none; stroke: var(--gb); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: schem-ping 3.2s ease-out infinite; }
    .schem .note { fill: rgba(0, 168, 123, 0.14); stroke: rgba(0, 168, 123, 0.45); stroke-width: 1; stroke-linejoin: round; }
    .schem .note-t { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
    @keyframes schem-march { to { stroke-dashoffset: -14; } }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes schem-ping { 0% { transform: scale(1); opacity: 0.8; } 70%, 100% { transform: scale(2.1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .schem .link, .schem .led, .schem .step-ring { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="ris-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Links — all four exchange both ways ══ -->
  <g id="ris-links">
    <!-- a  Hospital Information System ⇄ RIS -->
    <path class="link" d="M207 115 L360 203" marker-start="url(#ris-arrow)" marker-end="url(#ris-arrow)"/>
    <!-- b  RIS ⇄ DICOM Modalities -->
    <path class="link" d="M357 234 L203 322" marker-start="url(#ris-arrow)" marker-end="url(#ris-arrow)"/>
    <!-- c  RIS ⇄ Reporting Workstation -->
    <path class="link" d="M502 243 L628 243" marker-start="url(#ris-arrow)" marker-end="url(#ris-arrow)"/>
    <!-- d  RIS ⇄ PACS -->
    <path class="link" d="M432 358 L432 425" marker-start="url(#ris-arrow)" marker-end="url(#ris-arrow)"/>
  </g>

  <!-- ══ Packets: one each way per link ══ -->
  <g id="ris-packets" aria-hidden="true">
    <circle class="pkt" r="3.4" style="offset-path: path('M207 115 L360 203'); animation-delay: 0s"/>
    <circle class="pkt back" r="3.4" style="offset-path: path('M207 115 L360 203'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M357 234 L203 322'); animation-delay: -0.9s"/>
    <circle class="pkt back" r="3.4" style="offset-path: path('M357 234 L203 322'); animation-delay: -2.7s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M502 243 L628 243'); animation-delay: -0.5s"/>
    <circle class="pkt back" r="3.4" style="offset-path: path('M502 243 L628 243'); animation-delay: -2.3s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M432 358 L432 425'); animation-delay: -1.3s"/>
    <circle class="pkt back" r="3.4" style="offset-path: path('M432 358 L432 425'); animation-delay: -3.1s"/>
  </g>

  <!-- ══ Step 1 — Hospital Information System ══ -->
  <g id="n-his" transform="translate(100 25)">
    <circle class="step-ring" cx="45" cy="15" r="14"/>
    <circle class="step" cx="45" cy="15" r="14"/>
    <text class="step-n" x="45" y="20" text-anchor="middle">1</text>
    <rect class="ic ic-fill" x="4" y="42" width="82" height="54" rx="4"/>
    <path class="ic" d="M45 96v10M29 108h32"/>
    <text class="lbl" x="45" y="142" text-anchor="middle">Hospital</text>
    <text class="lbl" x="45" y="160" text-anchor="middle">Information</text>
    <text class="lbl" x="45" y="178" text-anchor="middle">System</text>
  </g>
  <!-- callout: HIS order -->
  <g id="c-order" transform="translate(222 62)">
    <path class="note" d="M12 0h60a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V24l-6-4 6-4V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="42" y="21" text-anchor="middle">HIS order</text>
  </g>

  <!-- ══ Step 2 — Radiology Information System ══ -->
  <g id="n-ris" transform="translate(377 155)">
    <circle class="step-ring" cx="53" cy="15" r="14" style="animation-delay: -0.8s"/>
    <circle class="step" cx="53" cy="15" r="14"/>
    <text class="step-n" x="53" y="20" text-anchor="middle">2</text>
    <rect class="ic ic-fill" x="0" y="52" width="34" height="76" rx="3"/>
    <path class="ic ic-soft" d="M7 63h20M7 71h20M7 79h20M7 87h20"/>
    <rect class="ic ic-fill" x="40" y="44" width="34" height="84" rx="3"/>
    <path class="ic ic-soft" d="M47 55h20M47 63h20M47 71h20M47 79h20"/>
    <circle class="ic" cx="57" cy="112" r="5"/>
    <rect class="ic ic-fill" x="80" y="52" width="34" height="76" rx="3"/>
    <path class="ic ic-soft" d="M87 63h20M87 71h20M87 79h20M87 87h20"/>
    <circle class="led" cx="8" cy="118" r="1.8"/>
    <circle class="led" cx="88" cy="118" r="1.8" style="animation-delay: -1.1s"/>
    <text class="lbl" x="57" y="150" text-anchor="middle">Radiology</text>
    <text class="lbl" x="57" y="168" text-anchor="middle">Information</text>
    <text class="lbl" x="57" y="186" text-anchor="middle">System</text>
  </g>
  <!-- callout: Reports uploaded in RIS (tail up-left to the RIS label) -->
  <g id="c-upload" transform="translate(487 318)">
    <path class="note" d="M6 0h106a6 6 0 0 1 6 6v36a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6l-6-8L6 0z"/>
    <text class="note-t" x="59" y="20" text-anchor="middle">Reports uploaded in</text>
    <text class="note-t" x="59" y="37" text-anchor="middle">RIS</text>
  </g>

  <!-- ══ Step 3 — DICOM Modalities ══ -->
  <g id="n-modalities" transform="translate(82 290)">
    <circle class="step-ring" cx="63" cy="15" r="14" style="animation-delay: -1.6s"/>
    <circle class="step" cx="63" cy="15" r="14"/>
    <text class="step-n" x="63" y="20" text-anchor="middle">3</text>
    <!-- scanner arm over bed -->
    <g class="ic" transform="translate(4 40)">
      <path d="M6 30 A24 24 0 0 1 54 30"/>
      <path class="ic-soft" d="M20 14v8M30 12v10M40 14v8"/>
      <circle cx="30" cy="34" r="5"/>
      <path d="M8 46h44l-4 8H12z"/>
    </g>
    <!-- MR / CT gantry -->
    <g class="ic" transform="translate(72 40)">
      <path class="ic-fill" d="M2 52V26A26 26 0 0 1 54 26v26"/>
      <circle cx="28" cy="26" r="12"/>
      <path d="M28 38v10M18 56h20"/>
    </g>
    <!-- ultrasound -->
    <g class="ic" transform="translate(4 104)">
      <rect class="ic-fill" x="12" y="2" width="20" height="14" rx="2"/>
      <path class="ic-soft" d="M17 9h3M23 6h4"/>
      <circle cx="10" cy="20" r="4"/>
      <path d="M6 44V30a4 4 0 0 1 8 0v8h12"/>
      <circle cx="44" cy="30" r="4"/>
      <path d="M4 44h50v6H4zM50 44V38a4 4 0 0 0-8 0v6M8 50v4M50 50v4"/>
    </g>
    <!-- C-arm -->
    <g class="ic" transform="translate(72 104)">
      <path d="M44 6a22 22 0 0 0 0 44"/>
      <rect x="40" y="0" width="12" height="10" rx="2"/>
      <rect x="40" y="44" width="12" height="10" rx="2"/>
      <rect class="ic-fill" x="4" y="28" width="26" height="20" rx="3"/>
      <path d="M6 54h22M10 48v6M24 48v6"/>
    </g>
    <text class="lbl" x="63" y="194" text-anchor="middle">DICOM</text>
    <text class="lbl" x="63" y="212" text-anchor="middle">Modalities</text>
  </g>

  <!-- ══ Step 4 — Reporting Workstation ══ -->
  <g id="n-workstation" transform="translate(648 157)">
    <circle class="step-ring" cx="47" cy="15" r="14" style="animation-delay: -2.4s"/>
    <circle class="step" cx="47" cy="15" r="14"/>
    <text class="step-n" x="47" y="20" text-anchor="middle">4</text>
    <rect class="ic ic-fill" x="0" y="42" width="84" height="56" rx="4"/>
    <path class="ic" d="M42 98v10M26 110h32"/>
    <rect class="ic ic-fill" x="92" y="60" width="26" height="38" rx="3"/>
    <circle class="ic" cx="105" cy="93" r="1.2"/>
    <text class="lbl" x="47" y="140" text-anchor="middle">Reporting</text>
    <text class="lbl" x="47" y="158" text-anchor="middle">Workstation</text>
  </g>
  <!-- callout: Radiologist reports study (tail down-right to step 4) -->
  <g id="c-report" transform="translate(553 133)">
    <path class="note" d="M6 0h78a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H76l12 9-4-9H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6z"/>
    <text class="note-t" x="45" y="17" text-anchor="middle">Radiologist</text>
    <text class="note-t" x="45" y="34" text-anchor="middle">reports study</text>
  </g>

  <!-- ══ PACS ══ -->
  <g id="n-pacs" transform="translate(408 434)">
    <g class="ic">
      <path class="ic-fill" d="M4 12v44c0 5 10 8 20 8s20-3 20-8V12"/>
      <ellipse class="ic-fill" cx="24" cy="12" rx="20" ry="7"/>
      <path class="ic-soft" d="M4 25c0 4 10 7 20 7s20-3 20-7M4 38c0 4 10 7 20 7s20-3 20-7M4 51c0 4 10 7 20 7s20-3 20-7"/>
    </g>
    <text class="lbl" x="24" y="86" text-anchor="middle">PACS</text>
  </g>
</svg>
