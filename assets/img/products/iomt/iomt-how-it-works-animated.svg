<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 15 730 445" role="img" aria-labelledby="how-schem-title how-schem-desc" class="schem">
  <title id="how-schem-title">How Raster's IoMT device works</title>
  <desc id="how-schem-desc">Along the top, a barcoded test tube, the analyser, the Raster IoMT device and the laboratory information system laptop with its server are joined by dotted lines without arrowheads. Below, five numbered steps chained by arrows: 1, the analyser reads the sample identification number from the barcode on the tube; 2, it requests the LIS for the tests to be performed; 3, the LIS responds with the test to be done for that SID number; 4, the analyser conducts the specified tests; 5, when complete, only the relevant and required result values are transferred to the LIS.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --ink-3: var(--text-low, #7f8d88); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --on-g: var(--on-green, #03110c); font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .ic-g { stroke: var(--gb); }
    .schem .fill-g { fill: rgba(0, 168, 123, 0.28); }
    .schem .screen { fill: rgba(0, 168, 123, 0.22); stroke: none; }
    .schem .txt { fill: var(--ink-2); font-size: 12.5px; font-weight: 500; }
    .schem .bus { fill: none; stroke: var(--g); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1.5 6; }
    .schem .arrow { fill: none; stroke: var(--g); stroke-width: 1.8; stroke-linecap: round; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .pkt.back { animation-direction: reverse; }
    /* the step packets run 1→2→3→4→5 in sequence over one 8s cycle */
    .schem .pkt.seq { animation: schem-seq 8s linear infinite; }
    .schem .step { fill: var(--g); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
    .schem .step-n { fill: var(--on-g); font-size: 14px; font-weight: 700; }
    .schem .step-ring { fill: none; stroke: var(--gb); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: schem-ping 8s ease-out infinite; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .core { transform-box: fill-box; transform-origin: 50% 50%; animation: schem-core 2.4s ease-in-out infinite; }
    .schem .scan { stroke: var(--gb); stroke-width: 1.4; opacity: 0.9; animation: schem-scan 2.4s ease-in-out infinite; }
    .schem .slip { transform-box: fill-box; transform-origin: 50% 0%; animation: schem-print 4s ease-in-out infinite; }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-seq { 0% { offset-distance: 0%; opacity: 0; } 2% { opacity: 1; } 18% { opacity: 1; } 20% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-ping { 0% { transform: scale(1); opacity: 0.8; } 14%, 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes schem-core { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @keyframes schem-scan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(18px); } }
    @keyframes schem-print { 0%, 15% { transform: scaleY(0); } 45%, 80% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .schem .step-ring, .schem .led, .schem .core, .schem .scan, .schem .slip { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="how-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Top line: dotted connectors with no arrowheads in the source ══ -->
  <g id="how-bus">
    <path class="bus" d="M192 104 H283"/>
    <path class="bus" d="M421 106 H461"/>
    <path class="bus" d="M537 106 H583"/>
  </g>
  <g aria-hidden="true">
    <circle class="pkt" r="3.2" style="offset-path: path('M192 104 H283'); animation-delay: 0s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M192 104 H283'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M421 106 H461'); animation-delay: -0.6s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M421 106 H461'); animation-delay: -2.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M537 106 H583'); animation-delay: -1.2s"/>
    <circle class="pkt back" r="3.2" style="offset-path: path('M537 106 H583'); animation-delay: -3s"/>
  </g>

  <!-- ══ Test tube with barcode ══ -->
  <g id="n-tube" transform="translate(150 70) rotate(-35 40 50)">
    <path class="ic ic-fill" d="M28 0h24M32 0v78a8 8 0 0 1-16 0V0"/>
    <path class="fill-g" d="M18 60v18a6 6 0 0 0 12 0V60z" style="stroke: none"/>
    <rect class="ic ic-fill" x="15" y="26" width="18" height="22" rx="1" style="fill: rgba(255,255,255,0.12)"/>
    <path class="ic" style="stroke-width: 1.2" d="M18 30v14M21 30v14M23 30v14M26 30v14M28 30v14M30 30v14"/>
    <line class="scan" x1="15" y1="28" x2="33" y2="28"/>
  </g>

  <!-- ══ Analyser ══ -->
  <g id="n-analyser" transform="translate(286 26)">
    <path class="ic ic-fill" d="M0 22a22 22 0 0 1 22-22h96a8 8 0 0 1 8 8v138a8 8 0 0 1-8 8H22a22 22 0 0 1-22-22z"/>
    <rect class="ic ic-fill screen" x="42" y="18" width="62" height="44" rx="2"/>
    <path class="ic ic-soft" d="M42 80h62a5 5 0 0 1 5 5v44a5 5 0 0 1-5 5H42a5 5 0 0 1-5-5V85a5 5 0 0 1 5-5z"/>
    <g class="slip"><path class="ic ic-fill" d="M12 84h16v40l-16 12z"/><path class="ic ic-soft" d="M16 92h8M16 100h8M16 108h8"/></g>
    <circle class="led" cx="112" cy="100" r="2.2"/>
  </g>

  <!-- ══ IoMT device ══ -->
  <g id="n-device" transform="translate(463 80)">
    <path class="ic ic-fill" d="M0 28l36-18 36 18-36 18z"/>
    <path class="ic ic-fill" d="M0 28v8l36 18 36-18v-8L36 46z"/>
    <path class="fill-g ic ic-g ic-soft" d="M12 24l18-9 9 4-18 9z"/>
    <g class="core" style="fill: var(--gb)"><path d="M44 30l4-2 3 1-4 2 3 1-4 2-3-1 4-2-3-1 4-2z" opacity="0.9"/></g>
  </g>

  <!-- ══ LIS laptop with server ══ -->
  <g id="n-lis" transform="translate(585 30)">
    <g class="ic" transform="translate(84 0)">
      <rect class="ic-fill" x="0" y="0" width="52" height="12" rx="3"/><rect class="ic-fill" x="0" y="18" width="52" height="12" rx="3"/><rect class="ic-fill" x="0" y="36" width="52" height="12" rx="3"/>
      <path class="ic-soft ic-g" d="M6 6h26M6 24h26M6 42h26M26 12v6M26 30v6"/>
    </g>
    <rect class="ic ic-fill" x="10" y="22" width="84" height="56" rx="4"/>
    <rect class="screen" x="14" y="26" width="76" height="48" rx="2"/>
    <path class="ic ic-fill" d="M0 78h104v8a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4z"/>
    <circle class="led" cx="44" cy="84" r="1.8"/><circle class="led" cx="52" cy="84" r="1.8" style="animation-delay: -0.7s"/><circle class="led" cx="60" cy="84" r="1.8" style="animation-delay: -1.4s"/>
    <rect class="ic ic-soft" x="72" y="81" width="18" height="6" rx="1"/>
  </g>

  <!-- ══ Step chain ══ -->
  <g id="how-steps-arrows">
    <path class="arrow" d="M179 323 L222 366" marker-end="url(#how-arrow)"/>
    <path class="arrow" d="M252 360 L326 247" marker-end="url(#how-arrow)"/>
    <path class="arrow" d="M388 292 L476 366" marker-end="url(#how-arrow)"/>
    <path class="arrow" d="M508 360 L578 249" marker-end="url(#how-arrow)"/>
  </g>
  <g aria-hidden="true">
    <circle class="pkt seq" r="3.4" style="offset-path: path('M179 323 L222 366'); animation-delay: -6.4s"/>
    <circle class="pkt seq" r="3.4" style="offset-path: path('M252 360 L326 247'); animation-delay: -4.8s"/>
    <circle class="pkt seq" r="3.4" style="offset-path: path('M388 292 L476 366'); animation-delay: -3.2s"/>
    <circle class="pkt seq" r="3.4" style="offset-path: path('M508 360 L578 249'); animation-delay: -1.6s"/>
  </g>

  <g id="s1" transform="translate(90 225)">
    <circle class="step-ring" r="15" style="animation-delay: 0s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">1</text>
    <text class="txt" x="29" y="4">The analyser reads the</text>
    <text class="txt" x="29" y="21">Sample Identification</text>
    <text class="txt" x="29" y="38">Number (SID No.)</text>
    <text class="txt" x="29" y="55">from the barcode,</text>
    <text class="txt" x="29" y="72">which is pasted on the</text>
    <text class="txt" x="29" y="89">test tube</text>
  </g>
  <g id="s2" transform="translate(240 385)">
    <circle class="step-ring" r="15" style="animation-delay: -6.4s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">2</text>
    <text class="txt" x="31" y="4">Then it requests the</text>
    <text class="txt" x="31" y="21">LIS for the tests</text>
    <text class="txt" x="31" y="38">which are to be</text>
    <text class="txt" x="31" y="55">performed</text>
  </g>
  <g id="s3" transform="translate(333 225)">
    <circle class="step-ring" r="15" style="animation-delay: -4.8s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">3</text>
    <text class="txt" x="23" y="4">The LIS responds with</text>
    <text class="txt" x="23" y="21">the test to be done for</text>
    <text class="txt" x="23" y="38">the specific SID No. to</text>
    <text class="txt" x="23" y="55">the analyser</text>
  </g>
  <g id="s4" transform="translate(496 385)">
    <circle class="step-ring" r="15" style="animation-delay: -3.2s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">4</text>
    <text class="txt" x="31" y="4">Analyser conducts</text>
    <text class="txt" x="31" y="21">the specified tests</text>
  </g>
  <g id="s5" transform="translate(588 225)">
    <circle class="step-ring" r="15" style="animation-delay: -1.6s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">5</text>
    <text class="txt" x="29" y="4">When the tests have</text>
    <text class="txt" x="29" y="21">been completed, only the</text>
    <text class="txt" x="29" y="38">relevant and required</text>
    <text class="txt" x="29" y="55">result values are</text>
    <text class="txt" x="29" y="72">transferred to Laboratory</text>
    <text class="txt" x="29" y="89">Information system (LIS)</text>
  </g>
</svg>
