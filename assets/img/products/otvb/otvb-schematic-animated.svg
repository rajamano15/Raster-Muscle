<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 25 680 355" role="img" aria-labelledby="ot-schem-title ot-schem-desc" class="schem">
  <title id="ot-schem-title">Operation theatre video broadcasting — schematic</title>
  <desc id="ot-schem-desc">The doctors office and the operation theatre each feed the control centre. The control centre records to the data archive and streams directly to a conference and a classroom. Two plain lines join the control centre to the internet, and from the internet streams go on to a second conference and a second classroom. Every arrow is one-way.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --bg: #0d1a16; font-family: inherit; color: var(--ink); }
    .schem .pic { fill: var(--ink); stroke: none; }
    .schem .pic-cut { fill: var(--bg); stroke: none; }
    .schem .pic-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .schem .pic-thin { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .pic-g { fill: var(--g); stroke: none; }
    .schem .pic-gb { fill: var(--gb); stroke: none; }
    .schem .lbl { fill: var(--ink-2); font-size: 13px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2; stroke-linecap: round; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .trace { stroke: var(--gb); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30 160; animation: schem-trace 2.4s linear infinite; }
    .schem .lamp { animation: schem-glow 2.4s ease-in-out infinite; }
    .schem .bubble { transform-box: fill-box; transform-origin: 0% 100%; animation: schem-talk 3s ease-in-out infinite; }
    .schem .cloud { transform-box: fill-box; transform-origin: 50% 50%; animation: schem-bob 5s ease-in-out infinite; }
    .schem .disc { animation: schem-disc 3s ease-in-out infinite; }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-trace { to { stroke-dashoffset: -190; } }
    @keyframes schem-glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes schem-talk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes schem-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes schem-disc { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .schem .trace, .schem .lamp, .schem .bubble, .schem .cloud, .schem .disc { animation: none; }
      .schem .trace { stroke-dasharray: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="ot-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
    <!-- one audience head with shoulders -->
    <path id="ot-head" fill="currentColor" d="M-6 0a6 6 0 1 1 12 0a6 6 0 0 1-12 0zM-10 14a10 8 0 0 1 20 0z"/>
  </defs>

  <!-- ══ Links ══ -->
  <g id="ot-links">
    <!-- Doctors Office → Control Centre -->
    <path class="link" d="M207 118 C250 120 290 136 312 152" marker-end="url(#ot-arrow)"/>
    <!-- Operation Theatre → Control Centre -->
    <path class="link" d="M222 262 C252 230 282 206 307 194" marker-end="url(#ot-arrow)"/>
    <!-- Control Centre → Conference (direct) -->
    <path class="link" d="M405 148 C450 120 500 96 550 80" marker-end="url(#ot-arrow)"/>
    <!-- Control Centre → Classroom (direct) -->
    <path class="link" d="M408 162 C480 166 600 156 676 132" marker-end="url(#ot-arrow)"/>
    <!-- Control Centre → Data Archive -->
    <path class="link" d="M361 232 V294" marker-end="url(#ot-arrow)"/>
    <!-- Control Centre — Internet: two plain lines, no arrowheads in the source -->
    <path class="link" d="M412 188 L447 193"/>
    <path class="link" d="M413 197 L452 210"/>
    <!-- Internet → Conference (via internet) -->
    <path class="link" d="M507 235 L560 277" marker-end="url(#ot-arrow)"/>
    <!-- Internet → Classroom (via internet) -->
    <path class="link" d="M531 203 C600 214 660 236 708 248" marker-end="url(#ot-arrow)"/>
  </g>
  <g id="ot-packets" aria-hidden="true">
    <circle class="pkt" r="3.2" style="offset-path: path('M207 118 C250 120 290 136 312 152'); animation-delay: 0s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M222 262 C252 230 282 206 307 194'); animation-delay: -1.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M405 148 C450 120 500 96 550 80'); animation-delay: -0.6s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M408 162 C480 166 600 156 676 132'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M361 232 V294'); animation-delay: -2.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M412 188 L447 193'); animation-delay: -3s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M413 197 L452 210'); animation-delay: -1.5s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M507 235 L560 277'); animation-delay: -0.9s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M531 203 C600 214 660 236 708 248'); animation-delay: -2.1s"/>
  </g>

  <!-- ══ Doctors Office: person on a swivel chair working at a laptop on a desk ══ -->
  <g id="n-office" transform="translate(127 86)">
    <!-- swivel chair -->
    <path class="pic" d="M2 26h6v22H2zM0 48h24v4H0zM10 52h4v10h-4zM2 62h20v3H2zM2 65a3 3 0 1 0 6 0zM16 65a3 3 0 1 0 6 0z"/>
    <!-- person: head, leaning torso, arm to the laptop, bent legs -->
    <circle class="pic" cx="22" cy="8" r="8"/>
    <path class="pic" d="M12 20c6-3 14-3 18 2l12 10-2 5-13-6 3 17v20h-7V50h-6v18h-7V38c-3-5-3-13 2-18z"/>
    <!-- desk with two legs -->
    <path class="pic" d="M34 44h50v4H34zM36 48h4v26h-4zM80 48h4v26h-4z"/>
    <!-- laptop -->
    <path class="pic" d="M56 24l4-20h22l-3 20z"/>
    <path class="pic-cut" d="M60 22l3-15h15l-2 15z"/>
    <path class="pic" d="M50 44h34l-2 4H50z" transform="translate(0 -4)"/>
    <text class="lbl" x="42" y="98" text-anchor="middle">Doctors Office</text>
  </g>

  <!-- ══ Operation Theatre: masked surgeon, surgeon at the table, patient, wheeled table, five-spot lamp ══ -->
  <g id="n-theatre" transform="translate(108 250)">
    <!-- OT lamp on its arm -->
    <path class="pic-line" d="M108 4c-8 0-14 6-14 14"/>
    <ellipse class="pic" cx="88" cy="26" rx="20" ry="11"/>
    <path class="pic" d="M92 12l8 6-4 4z"/>
    <g class="lamp pic-cut"><circle cx="78" cy="23" r="3.2"/><circle cx="88" cy="19" r="3.2"/><circle cx="98" cy="23" r="3.2"/><circle cx="83" cy="31" r="3.2"/><circle cx="94" cy="31" r="3.2"/></g>
    <!-- standing surgeon (left) with cap and mask -->
    <circle class="pic" cx="12" cy="24" r="8"/>
    <path class="pic-cut" d="M4 25h16v3a8 8 0 0 1-16 0z"/>
    <path class="pic" d="M4 34h16c4 0 6 3 6 7l10 6-2 5-10-4v22h-6V56h-4v14H8V42c-4-1-6-4-4-8z"/>
    <!-- surgeon at the table (centre), cap and mask -->
    <circle class="pic" cx="66" cy="44" r="7"/>
    <path class="pic-cut" d="M59 45h14v2a7 7 0 0 1-14 0z"/>
    <path class="pic" d="M56 52h20c5 0 8 4 8 9v9H48v-9c0-5 3-9 8-9z"/>
    <path class="pic-cut" d="M60 60h12v6H60z"/>
    <!-- patient lying on the table, knees raised, head to the right -->
    <path class="pic" d="M32 66h12l6-8h10l6 8h22v6H32z"/>
    <circle class="pic" cx="96" cy="68" r="6"/>
    <!-- table top, frame and wheels -->
    <path class="pic" d="M26 72h84v6H26zM34 78h68v3H34zM40 81h4v8h-4zM92 81h4v8h-4z"/>
    <circle class="pic" cx="42" cy="92" r="4"/><circle class="pic" cx="94" cy="92" r="4"/>
    <text class="lbl" x="60" y="112" text-anchor="middle">Operation Theatre</text>
  </g>

  <!-- ══ Control Centre: operator before a large screen and two angled side screens ══ -->
  <g id="n-control" transform="translate(318 132)">
    <rect class="pic-line" x="12" y="0" width="64" height="38" rx="2"/>
    <path class="trace" d="M18 20h10l3-7 4 14 4-11 4 8 3-4h20"/>
    <path class="pic-line" d="M0 44l20-2v26L0 70zM88 44l-20-2v26l20 2z"/>
    <path class="pic" d="M44 42a10 10 0 0 1 10 10v6a10 10 0 0 1-3 7h3a14 14 0 0 1 14 14v1H20v-1a14 14 0 0 1 14-14h3a10 10 0 0 1-3-7v-6a10 10 0 0 1 10-10z"/>
    <text class="lbl" x="44" y="94" text-anchor="middle">Control Centre</text>
  </g>

  <!-- ══ Data Archive: six-disc green stack ══ -->
  <g id="n-archive" transform="translate(339 304)">
    <g class="pic-g">
      <ellipse class="disc" cx="22" cy="8" rx="20" ry="6"/>
      <path class="disc" style="animation-delay: -0.5s" d="M2 14c0 3 9 6 20 6s20-3 20-6v-3c0 3-9 6-20 6S2 14 2 11z"/>
      <path class="disc" style="animation-delay: -1s" d="M2 21c0 3 9 6 20 6s20-3 20-6v-3c0 3-9 6-20 6S2 21 2 18z"/>
      <path class="disc" style="animation-delay: -1.5s" d="M2 28c0 3 9 6 20 6s20-3 20-6v-3c0 3-9 6-20 6S2 28 2 25z"/>
      <path class="disc" style="animation-delay: -2s" d="M2 35c0 3 9 6 20 6s20-3 20-6v-3c0 3-9 6-20 6S2 35 2 32z"/>
      <path class="disc" style="animation-delay: -2.5s" d="M2 42c0 3 9 6 20 6s20-3 20-6v-3c0 3-9 6-20 6S2 42 2 39z"/>
    </g>
    <text class="lbl" x="22" y="64" text-anchor="middle">Data Archive</text>
  </g>

  <!-- ══ Internet: two overlapping clouds ══ -->
  <g id="n-internet" transform="translate(450 182)">
    <g class="cloud">
      <path class="pic" d="M10 40h30a9 9 0 0 0 2-18a13 13 0 0 0-24-4a9 9 0 0 0-8 22z"/>
      <path class="pic-cut" d="M30 40h24a12 12 0 0 1 8-8a15 15 0 0 0-30 2a11 11 0 0 0-2 6z"/>
      <path class="pic" d="M30 52h44a12 12 0 0 0 2-24a16 16 0 0 0-31-4a11 11 0 0 0-15 28z"/>
    </g>
    <text class="lbl" x="38" y="70" text-anchor="middle">Internet</text>
  </g>

  <!-- ══ Conference: speaker at a lectern with a speech bubble, two rows of audience ══ -->
  <g id="n-conf1" transform="translate(538 40)">
    <circle class="pic" cx="46" cy="10" r="7"/>
    <path class="pic" d="M36 30a10 10 0 0 1 20 0v4H36z"/>
    <path class="pic" d="M30 34h32l5 14H25z"/>
    <path class="bubble pic" d="M58 2a8 8 0 1 1 5 13l-7 6 1-7a8 8 0 0 1 1-12z"/>
    <use href="#ot-head" x="18" y="50"/><use href="#ot-head" x="36" y="50"/><use href="#ot-head" x="54" y="50"/><use href="#ot-head" x="72" y="50"/>
    <use href="#ot-head" x="8" y="64"/><use href="#ot-head" x="26" y="64"/><use href="#ot-head" x="44" y="64"/><use href="#ot-head" x="62" y="64"/><use href="#ot-head" x="80" y="64"/>
    <text class="lbl" x="46" y="98" text-anchor="middle">Conference</text>
  </g>

  <!-- ══ Classroom: teacher at a whiteboard on an easel, three students ══ -->
  <g id="n-class1" transform="translate(684 38)">
    <circle class="pic" cx="12" cy="8" r="7"/>
    <path class="pic" d="M4 18h16c4 0 6 3 6 6l10-4 2 4-12 6v24h-5V40h-6v14H4V26c-3-2-3-6 0-8z"/>
    <rect class="pic-line" x="36" y="4" width="42" height="32" rx="3"/>
    <path class="pic" d="M55 0h3v5h-3zM55 36h3v14h-3zM49 50h15l-2 4h-11z"/>
    <path class="pic-line" d="M52 54l-10 18M62 54l10 18"/>
    <use href="#ot-head" x="12" y="66"/><use href="#ot-head" x="38" y="66"/><use href="#ot-head" x="64" y="66"/>
    <text class="lbl" x="40" y="98" text-anchor="middle">Classroom</text>
  </g>

  <!-- ══ Conference (via internet) ══ -->
  <g id="n-conf2" transform="translate(538 264)">
    <circle class="pic" cx="46" cy="10" r="7"/>
    <path class="pic" d="M36 30a10 10 0 0 1 20 0v4H36z"/>
    <path class="pic" d="M30 34h32l5 14H25z"/>
    <path class="bubble pic" style="animation-delay: -1.5s" d="M58 2a8 8 0 1 1 5 13l-7 6 1-7a8 8 0 0 1 1-12z"/>
    <use href="#ot-head" x="18" y="50"/><use href="#ot-head" x="36" y="50"/><use href="#ot-head" x="54" y="50"/><use href="#ot-head" x="72" y="50"/>
    <use href="#ot-head" x="8" y="64"/><use href="#ot-head" x="26" y="64"/><use href="#ot-head" x="44" y="64"/><use href="#ot-head" x="62" y="64"/><use href="#ot-head" x="80" y="64"/>
    <text class="lbl" x="46" y="98" text-anchor="middle">Conference</text>
  </g>

  <!-- ══ Classroom (via internet) ══ -->
  <g id="n-class2" transform="translate(684 262)">
    <circle class="pic" cx="12" cy="8" r="7"/>
    <path class="pic" d="M4 18h16c4 0 6 3 6 6l10-4 2 4-12 6v24h-5V40h-6v14H4V26c-3-2-3-6 0-8z"/>
    <rect class="pic-line" x="36" y="4" width="42" height="32" rx="3"/>
    <path class="pic" d="M55 0h3v5h-3zM55 36h3v14h-3zM49 50h15l-2 4h-11z"/>
    <path class="pic-line" d="M52 54l-10 18M62 54l10 18"/>
    <use href="#ot-head" x="12" y="66"/><use href="#ot-head" x="38" y="66"/><use href="#ot-head" x="64" y="66"/>
    <text class="lbl" x="40" y="98" text-anchor="middle">Classroom</text>
  </g>
</svg>
