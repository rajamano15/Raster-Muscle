<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 20 735 420" role="img" aria-labelledby="otc-schem-title otc-schem-desc" class="schem">
  <title id="otc-schem-title">Raster OT Broadcast — device connectivity</title>
  <desc id="otc-schem-desc">Laparoscopy, microphone, PTZ camera, OT light camera and patient monitor each feed into the Raster OT Broadcast unit. The unit outputs to the touch screen controller, to a multi view screen showing four sources, to a full screen showing source one, and to a streaming unit, which in turn feeds the conference, class room, internet streaming and recording server. Every arrow is one-way.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --bg: #0d1a16; font-family: inherit; color: var(--ink); }
    .schem .pic { fill: var(--ink); stroke: none; }
    .schem .pic-cut { fill: var(--bg); stroke: none; }
    .schem .pic-line { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .schem .pic-g { fill: var(--gb); stroke: none; }
    .schem .lbl { fill: var(--ink-2); font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .lbl-b { fill: var(--ink); font-size: 13.5px; font-weight: 700; }
    .schem .box { fill: rgba(255, 255, 255, 0.06); stroke: rgba(255, 255, 255, 0.28); stroke-width: 1.2; }
    .schem .box-t { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1.5 6; animation: schem-march 1.4s linear infinite; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.6s linear infinite; }
    .schem .q { stroke: rgba(4, 12, 10, 0.6); stroke-width: 1.2; }
    .schem .q1 { fill: #62c24b; } .schem .q2 { fill: #5ab846; } .schem .q3 { fill: #55ad42; } .schem .q4 { fill: #4fa33d; }
    .schem .q.live { animation: schem-live 4.8s steps(1, end) infinite; }
    .schem .full { fill: #cfe98a; }
    .schem .q-n { fill: #0a1c10; font-size: 11px; font-weight: 700; }
    .schem .full-n { fill: #0a1c10; font-size: 22px; font-weight: 700; }
    .schem .trace { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26 120; animation: schem-trace 2s linear infinite; }
    .schem .lamp { animation: schem-glow 2.4s ease-in-out infinite; }
    .schem .ripple { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: schem-ping 2.4s ease-out infinite; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    @keyframes schem-march { to { stroke-dashoffset: -15; } }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-live { 0%, 100% { filter: brightness(1); } 25% { filter: brightness(1.45); } }
    @keyframes schem-trace { to { stroke-dashoffset: -146; } }
    @keyframes schem-glow { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes schem-ping { 0% { transform: scale(0.6); opacity: 0.9; } 70%, 100% { transform: scale(1.8); opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      .schem .link, .schem .q.live, .schem .trace, .schem .lamp, .schem .ripple, .schem .led { animation: none; }
      .schem .trace { stroke-dasharray: none; }
      .schem .ripple, .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="otc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Arrows — all one-way ══ -->
  <g id="otc-links">
    <!-- sources → Raster OT Broadcast -->
    <path class="link" d="M170 91 C230 110 290 150 326 180" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M287 128 C290 152 306 176 326 191" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M170 202 H326" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M170 282 C230 260 290 230 326 213" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M170 380 C230 330 290 260 326 226" marker-end="url(#otc-arrow)"/>
    <!-- Raster OT Broadcast → touch screen controller -->
    <path class="link" d="M402 165 V128" marker-end="url(#otc-arrow)"/>
    <!-- Raster OT Broadcast → streaming unit, multi view screen, full screen -->
    <path class="link" d="M478 191 C520 195 570 208 606 214" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M478 209 C505 240 505 275 490 302" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M480 222 C530 235 585 265 606 300" marker-end="url(#otc-arrow)"/>
    <!-- streaming unit → conference, class room, internet streaming, recording server -->
    <path class="link" d="M622 202 L580 162" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M643 202 L610 90" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M659 202 L687 90" marker-end="url(#otc-arrow)"/>
    <path class="link" d="M678 202 L718 160" marker-end="url(#otc-arrow)"/>
  </g>
  <g id="otc-packets" aria-hidden="true">
    <circle class="pkt" r="3.2" style="offset-path: path('M170 91 C230 110 290 150 326 180'); animation-delay: 0s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M287 128 C290 152 306 176 326 191'); animation-delay: -0.7s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M170 202 H326'); animation-delay: -1.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M170 282 C230 260 290 230 326 213'); animation-delay: -2.1s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M170 380 C230 330 290 260 326 226'); animation-delay: -2.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M402 165 V128'); animation-delay: -1s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M478 191 C520 195 570 208 606 214'); animation-delay: -0.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M478 209 C505 240 505 275 490 302'); animation-delay: -1.8s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M480 222 C530 235 585 265 606 300'); animation-delay: -3.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M622 202 L580 162'); animation-delay: -2.4s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M643 202 L610 90'); animation-delay: -0.2s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M659 202 L687 90'); animation-delay: -1.6s"/>
    <circle class="pkt" r="3.2" style="offset-path: path('M678 202 L718 160'); animation-delay: -3s"/>
  </g>

  <!-- ══ Laparoscopy: monitor on a pole, surgeon with headlamp over a patient in the procedure chair ══ -->
  <g id="n-lap" transform="translate(70 34)">
    <!-- monitor on its pole -->
    <rect class="pic" x="0" y="0" width="34" height="26" rx="2"/>
    <rect class="pic-cut" x="3" y="3" width="28" height="18" rx="1"/>
    <path class="trace" style="stroke-width: 1.6; stroke-dasharray: 16 60" d="M6 13h6l3-6 4 10 4-8 3 4h5"/>
    <path class="pic" d="M15 26h4v10h-4z"/>
    <!-- surgeon: cap with headlamp, torso leaning over the patient, arm holding the instrument -->
    <circle class="pic" cx="66" cy="12" r="7.5"/>
    <path class="pic" d="M59 6h14l-1-4H60z"/>
    <circle class="pic-cut" cx="66" cy="1" r="2"/>
    <path class="pic" d="M56 22a10 10 0 0 1 20 0v24l-8 4-4-2-2-10-6 2-2-6 6-3z"/>
    <path class="pic" d="M56 30l-14 12 4 4 12-10z"/>
    <path class="pic-line" style="stroke-width: 2.2" d="M44 44c-6-2-10-6-12-12"/>
    <!-- patient reclining in the chair, head to the left, legs raised to the right -->
    <circle class="pic" cx="22" cy="42" r="6.5"/>
    <path class="pic" d="M28 46c10-2 22-2 34 0l14-2 14 8 6 10-5 3-6-8-12-6-16 3c-10 2-20 2-30 0z"/>
    <!-- chair: sloping back, seat sweeping into the pedestal, wide base -->
    <path class="pic" d="M10 40c6 8 16 12 30 12h34l16 6-3 6-14-5H42c-8 0-14 3-14 10v18H40v-20c-14 0-24-8-30-24z"/>
    <path class="pic" d="M30 78h32v6H30z"/>
    <text class="lbl" x="48" y="106" text-anchor="middle">Laparoscopy</text>
  </g>

  <!-- ══ PTZ Camera: flat-capped dome camera with lens ring ══ -->
  <g id="n-ptz" transform="translate(94 170)">
    <path class="pic" d="M2 8a20 8 0 0 1 40 0v5H2z"/>
    <rect class="pic" x="0" y="11" width="44" height="4" rx="1"/>
    <path class="pic" d="M4 15h36a18 20 0 0 1-36 0z"/>
    <circle class="pic-cut" cx="22" cy="26" r="7"/>
    <circle class="pic" cx="22" cy="26" r="4"/>
    <circle class="pic-cut" cx="22" cy="26" r="1.6"/>
    <text class="lbl" x="23" y="52" text-anchor="middle">PTZ Camera</text>
  </g>

  <!-- ══ OT Light Camera: bell-shaped lamp head, five spots, rays beneath ══ -->
  <g id="n-otlight" transform="translate(90 250)">
    <path class="pic" d="M22 0h12v6H22z"/>
    <path class="pic" d="M8 28c0-14 8-22 20-22s20 8 20 22v2H8z"/>
    <ellipse class="pic" cx="28" cy="31" rx="27" ry="8"/>
    <g class="lamp pic-cut"><ellipse cx="28" cy="31" rx="5" ry="3"/><ellipse cx="12" cy="29" rx="4" ry="2.4"/><ellipse cx="44" cy="29" rx="4" ry="2.4"/><ellipse cx="17" cy="35" rx="4" ry="2.4"/><ellipse cx="39" cy="35" rx="4" ry="2.4"/></g>
    <path class="pic-line lamp" style="stroke-width: 2.2" d="M12 44l-4 8M20 46l-2 8M28 46v8M36 46l2 8M44 44l4 8"/>
    <text class="lbl" x="28" y="72" text-anchor="middle">OT Light Camera</text>
  </g>

  <!-- ══ Patient Monitor: rounded bezel, waveform, stand ══ -->
  <g id="n-pm" transform="translate(90 358)">
    <rect class="pic" x="0" y="0" width="54" height="40" rx="5"/>
    <rect class="pic-cut" x="5" y="5" width="44" height="29" rx="2"/>
    <path class="trace" d="M9 22l8-8 6 6 8-12 6 10 6-5"/>
    <path class="pic" d="M23 40h8v5h-8z"/>
    <rect class="pic" x="12" y="45" width="30" height="4" rx="2"/>
    <text class="lbl" x="27" y="66" text-anchor="middle">Patient Monitor</text>
  </g>

  <!-- ══ Microphone: headset with boom ══ -->
  <g id="n-mic" transform="translate(271 62)">
    <path class="pic-line" style="stroke-width: 3.4" d="M4 22a14 14 0 0 1 28 0"/>
    <rect class="pic" x="0" y="20" width="9" height="13" rx="3"/>
    <rect class="pic" x="27" y="20" width="9" height="13" rx="3"/>
    <path class="pic-line" style="stroke-width: 2.2" d="M31 33v4a7 7 0 0 1-7 7h-6"/>
    <circle class="pic" cx="15" cy="44" r="3.2"/>
    <text class="lbl" x="18" y="52" text-anchor="middle">Microphone</text>
  </g>

  <!-- ══ Touch Screen Controller: tablet with a pointing hand and touch ripples ══ -->
  <g id="n-touch" transform="translate(376 46)">
    <rect class="pic" x="0" y="0" width="52" height="42" rx="6"/>
    <rect class="pic-cut" x="5" y="5" width="42" height="32" rx="2"/>
    <circle class="ripple" cx="22" cy="17" r="6" style="stroke: var(--ink)"/>
    <circle class="ripple" cx="22" cy="17" r="6" style="stroke: var(--ink); animation-delay: -1.2s"/>
    <!-- hand: index finger up, three folded fingers, thumb, wrist -->
    <path class="pic" d="M19 10a3 3 0 0 1 6 0v18h3v-5a3 3 0 0 1 6 0v5h3v-3a3 3 0 0 1 6 0v10a12 12 0 0 1-12 12h-6a10 10 0 0 1-8-4l-7-9 4-3 5 4z"/>
    <path class="pic" d="M22 47h20v6H22z"/>
    <text class="lbl" x="26" y="67" text-anchor="middle">Touch Screen Controller</text>
  </g>

  <!-- ══ Raster OT Broadcast: rack unit with display window and knob ══ -->
  <g id="n-broadcast" transform="translate(335 170)">
    <rect class="pic" x="0" y="0" width="139" height="60" rx="8"/>
    <rect class="pic-cut" x="13" y="12" width="82" height="36" rx="2"/>
    <circle class="pic-cut" cx="119" cy="30" r="8.5"/>
    <circle class="led" cx="128" cy="11" r="2"/>
    <text class="lbl-b" x="69" y="78" text-anchor="middle">Raster OT Broadcast</text>
  </g>

  <!-- ══ Streaming unit (unlabelled in the source): low box, bar display, square, knob, feet ══ -->
  <g id="n-encoder" transform="translate(611 207)">
    <rect class="pic" x="0" y="0" width="85" height="23" rx="5"/>
    <rect class="pic-cut" x="7" y="8" width="42" height="8" rx="1"/>
    <rect class="pic-cut" x="53" y="7" width="6" height="10" rx="1"/>
    <circle class="pic-cut" cx="73" cy="12" r="4.5"/>
    <circle class="led" cx="73" cy="12" r="2" style="animation-delay: -1.1s"/>
    <path class="pic" d="M8 23h10v4H8zM67 23h10v4H67z"/>
  </g>

  <!-- ══ Destination boxes ══ -->
  <g id="n-boxes">
    <rect class="box" x="550" y="33" width="83" height="47" rx="9"/>
    <text class="box-t" x="591" y="52" text-anchor="middle">Class</text><text class="box-t" x="591" y="70" text-anchor="middle">Room</text>
    <rect class="box" x="663" y="33" width="83" height="47" rx="9"/>
    <text class="box-t" x="704" y="52" text-anchor="middle">Internet</text><text class="box-t" x="704" y="70" text-anchor="middle">Streaming</text>
    <rect class="box" x="509" y="109" width="82" height="45" rx="9"/>
    <text class="box-t" x="550" y="136" text-anchor="middle">Conference</text>
    <rect class="box" x="702" y="109" width="81" height="45" rx="9"/>
    <text class="box-t" x="742" y="127" text-anchor="middle">Recording</text><text class="box-t" x="742" y="145" text-anchor="middle">Server</text>
  </g>

  <!-- ══ Multi View Screen: 2×2 sources ══ -->
  <g id="n-multi" transform="translate(326 306)">
    <rect class="pic" x="0" y="0" width="150" height="90" rx="3"/>
    <rect class="q q1 live" x="4" y="4" width="71" height="41"/>
    <rect class="q q2 live" x="75" y="4" width="71" height="41" style="animation-delay: -1.2s"/>
    <rect class="q q3 live" x="4" y="45" width="71" height="41" style="animation-delay: -2.4s"/>
    <rect class="q q4 live" x="75" y="45" width="71" height="41" style="animation-delay: -3.6s"/>
    <text class="q-n" x="40" y="29" text-anchor="middle">1</text><text class="q-n" x="111" y="29" text-anchor="middle">2</text>
    <text class="q-n" x="40" y="70" text-anchor="middle">3</text><text class="q-n" x="111" y="70" text-anchor="middle">4</text>
    <path class="pic" d="M68 90h14v6H68zM42 96h66v5a3 3 0 0 1-3 3H45a3 3 0 0 1-3-3z"/>
    <text class="lbl" x="75" y="118" text-anchor="middle">Multi View Screen</text>
  </g>

  <!-- ══ Full Screen: source 1 ══ -->
  <g id="n-full" transform="translate(559 306)">
    <rect class="pic" x="0" y="0" width="152" height="90" rx="3"/>
    <rect class="full" x="4" y="4" width="144" height="82"/>
    <text class="full-n" x="76" y="53" text-anchor="middle">1</text>
    <path class="pic" d="M69 90h14v6H69zM43 96h66v5a3 3 0 0 1-3 3H46a3 3 0 0 1-3-3z"/>
    <text class="lbl" x="76" y="118" text-anchor="middle">Full Screen</text>
  </g>
</svg>
