<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 30 760 275" role="img" aria-labelledby="bi-schem-title bi-schem-desc" class="schem">
  <title id="bi-schem-title">Bi-directional equipment interface</title>
  <desc id="bi-schem-desc">Step 1: barcoded samples go into the lab analyser. Step 2: the LIS / HIS sends the work list to the analyser. Step 3: results flow from the analyser to the LIS / HIS. Step 4: reports flow out of the LIS / HIS. Each arrow is one-way; the work list is the only one running right to left.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --on-g: var(--on-green, #03110c); font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .screen { fill: rgba(0, 168, 123, 0.22); stroke: none; }
    .schem .ui { fill: var(--ink); stroke: none; opacity: 0.9; }
    .schem .pill { fill: rgba(0, 168, 123, 0.18); stroke: rgba(0, 168, 123, 0.5); stroke-width: 1.2; }
    .schem .pill-t { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .schem .lbl { fill: var(--ink-2); font-size: 14px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 6.5; animation: schem-march 1.4s linear infinite; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 3.2s linear infinite; }
    .schem .step { fill: var(--g); stroke: rgba(255, 255, 255, 0.35); stroke-width: 1.5; }
    .schem .step-n { fill: var(--on-g); font-size: 14px; font-weight: 700; }
    .schem .step-ring { fill: none; stroke: var(--gb); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: schem-ping 3.2s ease-out infinite; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .bar { transform-box: fill-box; transform-origin: 0% 50%; animation: schem-grow 3.2s ease-in-out infinite; }
    .schem .tube { transform-box: fill-box; transform-origin: 50% 100%; animation: schem-dip 3.2s ease-in-out infinite; }
    @keyframes schem-march { to { stroke-dashoffset: -17; } }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-ping { 0% { transform: scale(1); opacity: 0.8; } 70%, 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes schem-grow { 0%, 100% { transform: scaleX(0.55); } 50% { transform: scaleX(1); } }
    @keyframes schem-dip { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .schem .link, .schem .step-ring, .schem .led, .schem .bar, .schem .tube { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="bi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Title pills ══ -->
  <rect class="pill" x="226" y="52" width="130" height="46" rx="12"/>
  <text class="pill-t" x="291" y="80" text-anchor="middle">Lab Analyser</text>
  <rect class="pill" x="555" y="52" width="112" height="46" rx="12"/>
  <text class="pill-t" x="611" y="80" text-anchor="middle">LIS / HIS</text>

  <!-- ══ Arrows — each one-way; the work list is the only right-to-left one ══ -->
  <g id="bi-links">
    <!-- 1  Samples (Barcoded) → Lab Analyser -->
    <path class="link" d="M81 246 H178" marker-end="url(#bi-arrow)"/>
    <!-- 2  LIS / HIS → Lab Analyser (Work List) -->
    <path class="link" d="M549 194 H405" marker-end="url(#bi-arrow)"/>
    <!-- 3  Lab Analyser → LIS / HIS (Results) -->
    <path class="link" d="M405 246 H549" marker-end="url(#bi-arrow)"/>
    <!-- 4  LIS / HIS → Reports (out) -->
    <path class="link" d="M662 246 H775" marker-end="url(#bi-arrow)"/>
  </g>
  <g id="bi-packets" aria-hidden="true">
    <circle class="pkt" r="3.6" style="offset-path: path('M81 246 H178'); animation-delay: 0s"/>
    <circle class="pkt" r="3.6" style="offset-path: path('M549 194 H405'); animation-delay: -0.8s"/>
    <circle class="pkt" r="3.6" style="offset-path: path('M405 246 H549'); animation-delay: -1.6s"/>
    <circle class="pkt" r="3.6" style="offset-path: path('M662 246 H775'); animation-delay: -2.4s"/>
  </g>

  <!-- ══ Arrow labels ══ -->
  <text class="lbl" x="128" y="206" text-anchor="middle">Samples</text>
  <text class="lbl" x="128" y="226" text-anchor="middle">(Barcoded)</text>
  <text class="lbl" x="468" y="178" text-anchor="middle">Work List</text>
  <text class="lbl" x="468" y="232" text-anchor="middle">Results</text>
  <text class="lbl" x="718" y="232" text-anchor="middle">Reports</text>

  <!-- ══ Step badges ══ -->
  <g id="steps">
    <g transform="translate(128 281)"><circle class="step-ring" r="15"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">1</text></g>
    <g transform="translate(468 135)"><circle class="step-ring" r="15" style="animation-delay: -0.8s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">2</text></g>
    <g transform="translate(468 281)"><circle class="step-ring" r="15" style="animation-delay: -1.6s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">3</text></g>
    <g transform="translate(718 281)"><circle class="step-ring" r="15" style="animation-delay: -2.4s"/><circle class="step" r="15"/><text class="step-n" y="5" text-anchor="middle">4</text></g>
  </g>

  <!-- ══ Lab Analyser ══ -->
  <g id="n-analyser" transform="translate(190 130)">
    <rect class="ic ic-fill" x="150" y="0" width="46" height="34" rx="3"/>
    <path class="ic ic-soft" d="M156 8h10M170 8h10M156 14h34M156 20h22"/>
    <path class="ic" d="M173 34v8M162 42h22M152 56h48"/>
    <rect class="ic ic-fill" x="8" y="44" width="150" height="30" rx="4"/>
    <g class="ic ic-soft">
      <g class="tube"><path d="M18 50v18M24 50v18M30 50v18"/></g>
      <g class="tube" style="animation-delay: -1.6s"><path d="M36 50v18M42 50v18M48 50v18"/></g>
      <rect x="60" y="52" width="18" height="14" rx="2"/><rect x="84" y="52" width="18" height="14" rx="2"/>
      <rect x="108" y="52" width="18" height="14" rx="2"/><rect x="132" y="52" width="18" height="14" rx="2"/>
    </g>
    <rect class="ic ic-fill" x="0" y="74" width="204" height="92" rx="5"/>
    <path class="ic ic-soft" d="M102 80v80M12 80h180"/>
    <circle class="led" cx="192" cy="86" r="2.2"/>
  </g>

  <!-- ══ LIS / HIS monitor ══ -->
  <g id="n-lis" transform="translate(570 218)">
    <rect class="ic ic-fill" x="0" y="0" width="84" height="56" rx="4"/>
    <rect class="screen" x="4" y="4" width="76" height="48" rx="2"/>
    <path class="ic ic-soft" d="M18 10v38h50"/>
    <g class="ui">
      <rect class="bar" x="21" y="12" width="38" height="6" rx="1"/>
      <rect class="bar" x="21" y="21" width="22" height="6" rx="1" style="animation-delay: -0.8s"/>
      <rect class="bar" x="21" y="30" width="30" height="6" rx="1" style="animation-delay: -1.6s"/>
      <rect class="bar" x="21" y="39" width="12" height="6" rx="1" style="animation-delay: -2.4s"/>
    </g>
    <path class="ic" d="M42 56v8M30 66h24"/>
  </g>
</svg>
