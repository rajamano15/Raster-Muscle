<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 25 750 585" role="img" aria-labelledby="lis-schem-title lis-schem-desc" class="schem">
  <title id="lis-schem-title">Laboratory Information System — analyser integration</title>
  <desc id="lis-schem-desc">Raster Lab Link sends the worklist to the lab analyser and the analyser returns results to Lab Link. Sampling and barcode printing feeds Lab Link, and is also connected to the LIS. Results are updated from Lab Link into the LIS, and the LIS prints the report.</desc>
  <style>
    .schem { --ink: var(--text-hi, #f2f7f5); --ink-2: var(--text-mid, #b9c6c1); --ink-3: var(--text-low, #7f8d88); --g: var(--green, #00A87B); --gb: var(--green-bright, #00CF97); --halo: #0e1a16; font-family: inherit; }
    .schem .ic { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .ic-fill { fill: rgba(255, 255, 255, 0.07); }
    .schem .ic-soft { stroke-width: 1.6; opacity: 0.7; }
    .schem .screen { fill: rgba(0, 168, 123, 0.22); stroke: none; }
    .schem .ui { fill: var(--ink); stroke: none; opacity: 0.9; }
    .schem .lbl { fill: var(--ink-2); font-size: 14px; font-weight: 500; letter-spacing: 0.01em; }
    .schem .on-line { fill: var(--ink); font-size: 13.5px; font-weight: 600; paint-order: stroke; stroke: var(--halo); stroke-width: 9px; stroke-linejoin: round; }
    .schem .link { fill: none; stroke: var(--g); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .schem .link.plain { stroke: var(--ink-3); stroke-width: 1.8; }
    .schem .head { fill: var(--g); }
    .schem .pkt { fill: var(--gb); filter: drop-shadow(0 0 4px rgba(0, 207, 151, 0.9)); offset-rotate: 0deg; animation: schem-pkt 4s linear infinite; }
    .schem .led { fill: var(--gb); animation: schem-blink 2.2s ease-in-out infinite; }
    .schem .bar { transform-box: fill-box; transform-origin: 0% 50%; animation: schem-grow 4s ease-in-out infinite; }
    .schem .label-out { transform-box: fill-box; transform-origin: 50% 0%; animation: schem-print 4s ease-in-out infinite; }
    .schem .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: schem-spin 9s linear infinite; }
    .schem .row { animation: schem-row 8s ease-in-out infinite; }
    .schem .rep-t { fill: var(--ink-2); font-size: 6.5px; font-weight: 500; }
    .schem .rep-h { fill: var(--ink); font-size: 8px; font-weight: 700; }
    .schem .rep-b { fill: var(--gb); font-size: 6.5px; font-weight: 600; }
    @keyframes schem-pkt { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes schem-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes schem-grow { 0%, 100% { transform: scaleX(0.55); } 50% { transform: scaleX(1); } }
    @keyframes schem-print { 0%, 15% { transform: scaleY(0); } 45%, 80% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    @keyframes schem-spin { to { transform: rotate(360deg); } }
    @keyframes schem-row { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .schem .led, .schem .bar, .schem .label-out, .schem .spin, .schem .row { animation: none; }
      .schem .pkt { display: none; }
    }
  </style>
  <defs>
    <marker id="lis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path class="head" d="M1 1.5 L9 5 L1 8.5 Z"/>
    </marker>
  </defs>

  <!-- ══ Links ══ -->
  <g id="lis-links">
    <!-- a  Lab Link → Lab Analyser (Worklist) -->
    <path class="link" d="M222 74 H526" marker-end="url(#lis-arrow)"/>
    <!-- b  Lab Analyser → Lab Link (Results) -->
    <path class="link" d="M526 107 H222" marker-end="url(#lis-arrow)"/>
    <!-- c  Sampling and Barcode Printing → Lab Link -->
    <path class="link" d="M285 252 V141 H222" marker-end="url(#lis-arrow)"/>
    <!-- d  Lab Link → LIS (Result updated in LIS) -->
    <path class="link" d="M128 237 V429" marker-end="url(#lis-arrow)"/>
    <!-- e  Sampling and Barcode Printing — LIS (plain connector in the source: no arrowhead) -->
    <path class="link plain" d="M285 348 V472 H222"/>
    <!-- f  LIS → Report (Report Printing) -->
    <path class="link" d="M222 500 H526" marker-end="url(#lis-arrow)"/>
  </g>
  <g id="lis-packets" aria-hidden="true">
    <circle class="pkt" r="3.4" style="offset-path: path('M222 74 H526'); animation-delay: 0s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M526 107 H222'); animation-delay: -2s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M285 252 V141 H222'); animation-delay: -1s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M128 237 V429'); animation-delay: -3s"/>
    <circle class="pkt" r="3.4" style="offset-path: path('M222 500 H526'); animation-delay: -1.5s"/>
  </g>
  <!-- labels that sit on the lines (haloed so packets pass behind them) -->
  <text class="on-line" x="374" y="79" text-anchor="middle">Worklist</text>
  <text class="on-line" x="374" y="112" text-anchor="middle">Results</text>
  <text class="on-line" x="128" y="364" text-anchor="middle">Result updated</text>
  <text class="on-line" x="128" y="386" text-anchor="middle">in LIS</text>
  <text class="on-line" x="374" y="505" text-anchor="middle">Report Printing</text>

  <!-- ══ Raster LAB LINK ══ -->
  <g id="n-lablink" transform="translate(70 65)">
    <rect class="ic ic-fill" x="0" y="0" width="122" height="82" rx="5"/>
    <rect class="screen" x="5" y="5" width="112" height="72" rx="2"/>
    <path class="ic ic-soft" d="M28 14v54h68"/>
    <g class="ui">
      <rect class="bar" x="32" y="16" width="52" height="8" rx="1"/>
      <rect class="bar" x="32" y="28" width="30" height="8" rx="1" style="animation-delay: -1s"/>
      <rect class="bar" x="32" y="40" width="40" height="8" rx="1" style="animation-delay: -2s"/>
      <rect class="bar" x="32" y="52" width="14" height="8" rx="1" style="animation-delay: -3s"/>
    </g>
    <path class="ic" d="M61 82v10M44 94h34"/>
    <text class="lbl" x="58" y="128" text-anchor="middle">Raster</text>
    <text class="lbl" x="58" y="150" text-anchor="middle">LAB LINK</text>
  </g>

  <!-- ══ Lab Analyser ══ -->
  <g id="n-analyser" transform="translate(563 40)">
    <!-- operator monitor on its arm -->
    <rect class="ic ic-fill" x="148" y="0" width="46" height="34" rx="3"/>
    <path class="ic ic-soft" d="M154 8h10M168 8h10M154 14h34M154 20h22"/>
    <path class="ic" d="M171 34v8M160 42h22M150 56h48"/>
    <!-- top deck with sample racks -->
    <rect class="ic ic-fill" x="8" y="44" width="150" height="30" rx="4"/>
    <g class="ic ic-soft">
      <path d="M18 50v18M24 50v18M30 50v18M36 50v18M42 50v18M48 50v18"/>
      <rect x="60" y="52" width="18" height="14" rx="2"/><rect x="84" y="52" width="18" height="14" rx="2"/>
      <rect x="108" y="52" width="18" height="14" rx="2"/><rect x="132" y="52" width="18" height="14" rx="2"/>
    </g>
    <!-- cabinet -->
    <rect class="ic ic-fill" x="0" y="74" width="200" height="90" rx="5"/>
    <path class="ic ic-soft" d="M100 80v78M12 80h176"/>
    <circle class="led" cx="188" cy="86" r="2.2"/>
    <text class="lbl" x="100" y="184" text-anchor="middle">Lab Analyser</text>
  </g>

  <!-- ══ Sampling and Barcode Printing ══ -->
  <g id="n-printer" transform="translate(259 270)">
    <path class="ic ic-fill" d="M4 22l14-14h30l8 14v34a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
    <path class="ic ic-soft" d="M12 22h36M42 14h.1"/>
    <path class="ic" d="M20 38h22"/>
    <g class="label-out">
      <rect class="ic ic-fill" x="26" y="40" width="22" height="26" rx="2" transform="rotate(-18 37 40)"/>
      <path class="ic ic-soft" d="M31 47v10M34 47v10M38 47v10M41 47v10M44 47v10" transform="rotate(-18 37 40)"/>
    </g>
    <text class="lbl" x="130" y="16" text-anchor="middle">Sampling and</text>
    <text class="lbl" x="130" y="38" text-anchor="middle">Barcode Printing</text>
  </g>

  <!-- ══ LIS ══ -->
  <g id="n-lis" transform="translate(61 444)">
    <rect class="ic ic-fill" x="0" y="0" width="132" height="92" rx="5"/>
    <rect class="screen" x="5" y="5" width="122" height="76" rx="2"/>
    <g class="ui">
      <rect x="14" y="18" width="56" height="5" rx="1"/><rect x="14" y="34" width="56" height="5" rx="1"/>
      <rect x="14" y="50" width="56" height="5" rx="1"/><rect x="14" y="66" width="32" height="5" rx="1"/>
    </g>
    <!-- Raster asterisk mark -->
    <g class="spin" style="fill: var(--ink)">
      <path d="M96 30l4 10-4 10-4-10z"/>
      <path d="M96 30l4 10-4 10-4-10z" transform="rotate(72 96 40)"/>
      <path d="M96 30l4 10-4 10-4-10z" transform="rotate(144 96 40)"/>
      <path d="M96 30l4 10-4 10-4-10z" transform="rotate(216 96 40)"/>
      <path d="M96 30l4 10-4 10-4-10z" transform="rotate(288 96 40)"/>
    </g>
    <path class="ic" d="M66 92v10M48 104h36"/>
  </g>

  <!-- ══ Report ══ -->
  <g id="n-report" transform="translate(535 366)">
    <text class="lbl" x="127" y="-14" text-anchor="middle">Report</text>
    <rect class="ic ic-fill" x="0" y="0" width="254" height="230" rx="3"/>
    <text class="rep-h" x="12" y="18">SKS Hospital</text>
    <text class="rep-h" x="12" y="29" style="fill: var(--gb)">Laboratory</text>
    <circle class="ic ic-soft" cx="232" cy="20" r="11"/>
    <path class="ic ic-soft" d="M228 16l4 6 4-6M232 22v5"/>
    <text class="rep-t" x="127" y="42" text-anchor="middle" style="font-weight:700">REPORT</text>
    <path class="ic ic-soft" d="M10 46h234"/>
    <text class="rep-t" x="12" y="56">Lab No.  20/02/006993</text>
    <text class="rep-t" x="12" y="65">Patient</text>
    <text class="rep-t" x="12" y="74">Age / Sex</text>
    <text class="rep-t" x="12" y="83">Ref. By</text>
    <rect class="ui" x="46" y="59" width="66" height="26" rx="1" style="opacity: 0.25"/>
    <text class="rep-t" x="112" y="56">MRN</text>
    <text class="rep-t" x="112" y="65">IP/OP No</text>
    <text class="rep-t" x="112" y="74">Bill No.  19196176</text>
    <path class="ic" style="stroke-width: 1.3" d="M186 52v10M189 52v10M192 52v10M196 52v10M198 52v10M202 52v10M205 52v10M209 52v10M211 52v10M214 52v10M218 52v10M221 52v10M225 52v10M228 52v10M231 52v10M235 52v10M238 52v10M242 52v10"/>
    <text class="rep-t" x="246" y="71" text-anchor="end" style="font-size: 5px">Collected 18/02/2020 7.05 AM</text>
    <text class="rep-t" x="246" y="80" text-anchor="end" style="font-size: 5px">Reported 18/02/2020 8.34 AM</text>
    <text class="rep-t" x="246" y="89" text-anchor="end" style="font-size: 5px">Printed 18/02/2020 1.51 PM</text>
    <path class="ic ic-soft" d="M10 94h234"/>
    <text class="rep-t" x="127" y="103" text-anchor="middle" style="font-weight:700">Final Report</text>
    <text class="rep-t" x="12" y="115" style="font-weight:700">Specimen</text>
    <text class="rep-t" x="52" y="115" style="font-weight:700">Test Description</text>
    <text class="rep-t" x="140" y="115" style="font-weight:700">Result / Units</text>
    <text class="rep-t" x="192" y="115" style="font-weight:700">Reference Range</text>
    <path class="ic ic-soft" d="M10 119h234"/>
    <g class="row" style="animation-delay: 0s">
      <text class="rep-b" x="12" y="130">BIOCHEMISTRY</text>
      <text class="rep-t" x="12" y="137" style="font-size: 5.6px">FLUORIDE</text>
      <text class="rep-t" x="12" y="144" style="font-size: 5.6px">PLASMA</text>
      <text class="rep-t" x="52" y="140">GLUCOSE - FASTING</text><text class="rep-t" x="140" y="140">109.8 mg/dL</text><text class="rep-t" x="192" y="140">70 - 100</text>
    </g>
    <g class="row" style="animation-delay: -1.3s">
      <text class="rep-t" x="12" y="155">SERUM</text><text class="rep-t" x="52" y="155">UREA</text><text class="rep-t" x="140" y="155">30.5 mg/dL</text><text class="rep-t" x="192" y="155">10 - 50</text>
    </g>
    <g class="row" style="animation-delay: -2.6s">
      <text class="rep-t" x="12" y="170">SERUM</text><text class="rep-t" x="52" y="170">CREATININE</text><text class="rep-t" x="140" y="170">1.25 mg/dL</text><text class="rep-t" x="192" y="170">0.7 - 1.3</text>
    </g>
    <g class="row" style="animation-delay: -3.9s">
      <text class="rep-b" x="12" y="186">LIPID PROFILE</text>
      <text class="rep-t" x="12" y="196">SERUM</text><text class="rep-t" x="52" y="196">CHOLESTEROL</text><text class="rep-t" x="140" y="196">214 mg/dL</text><text class="rep-t" x="192" y="196">Desirable &lt;200</text>
    </g>
    <g class="row" style="animation-delay: -5.2s">
      <text class="rep-t" x="12" y="212">SERUM</text><text class="rep-t" x="52" y="212">TRIGLYCERIDES</text><text class="rep-t" x="140" y="212">218 mg/dL</text><text class="rep-t" x="192" y="212">Normal &lt;150</text>
    </g>
  </g>
</svg>
